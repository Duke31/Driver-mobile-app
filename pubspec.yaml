name: ambulance_driver_app
description: "Native Ambulance Driver & Emergency Telemetry Console for Ogbomoso Emergency Dispatch Network"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Supabase Backend & Real-time Subscriptions
  supabase_flutter: ^2.8.0

  # High-accuracy GPS & Geolocation
  geolocator: ^13.0.0

  # Keep screen awake on vehicle dashboard
  wakelock_plus: ^1.2.8

  # Hardware Telemetry (Battery & Connectivity)
  battery_plus: ^6.1.1
  connectivity_plus: ^6.1.0

  # Turn-by-turn Navigation Intents (Google Maps / Waze) & Phone Calls
  url_launcher: ^6.3.1

  # Audio Chime / Siren on incoming dispatch
  audioplayers: ^6.1.0

  # Utilities & UI
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
